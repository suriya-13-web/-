<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>டீ கடை பில்லிங்</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Tamil:wght@500;700&family=Noto+Sans+Tamil:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#14100a;--card:#1f1810;--line:#3a2d16;--gold:#d4af37;--gold2:#f3d98b;--text:#f6ecd2;--mute:#a8966b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans Tamil",system-ui,sans-serif}
body{padding:env(safe-area-inset-top,0) 0 calc(96px + env(safe-area-inset-bottom,0))}
header{padding:20px 16px 8px;text-align:center;position:relative}
h1{margin:0;font-family:"Noto Serif Tamil",serif;font-size:26px;background:linear-gradient(90deg,#b8902a,var(--gold2),#b8902a);-webkit-background-clip:text;background-clip:text;color:transparent}
header p{margin:4px 0 0;color:var(--mute);font-size:13px}
.cog{position:absolute;right:12px;top:calc(14px + env(safe-area-inset-top,0));width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--gold);font-size:18px;cursor:pointer}
.addbtn{margin:8px 12px 0;width:calc(100% - 24px);padding:13px;border-radius:14px;border:1.5px dashed var(--gold);background:transparent;color:var(--gold);font:600 16px "Noto Sans Tamil",sans-serif;cursor:pointer}
.list{padding:10px 12px;display:grid;gap:10px}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer;user-select:none;-webkit-user-select:none;transition:border-color .15s}
.item.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.ph{width:52px;height:52px;border-radius:12px;flex:none;background:#2a2112 center/cover no-repeat;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--gold);font:700 20px "Noto Serif Tamil",serif}
.info{flex:1;min-width:0}
.nm{font-size:17px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr{color:var(--gold);font-size:14px;margin-top:2px}
.qty{display:none;align-items:center;gap:10px}
.item.on .qty{display:flex}
.qty button{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--gold);background:transparent;color:var(--gold);font-size:22px;line-height:1;cursor:pointer}
.qty button:active{background:var(--gold);color:#1a1405}
.qty b{min-width:24px;text-align:center;font-size:19px;color:var(--gold2)}
.add{color:var(--mute);font-size:13px}
.item.on .add{display:none}
.hint{text-align:center;color:var(--mute);font-size:12px;padding:0 16px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 14px calc(12px + env(safe-area-inset-bottom,0));background:rgba(20,16,10,.96);border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;backdrop-filter:blur(8px);z-index:3}
.tot{flex:1}
.tot small{color:var(--mute);font-size:12px;display:block}
.tot strong{font-size:24px;color:var(--gold2)}
.btn{border:0;border-radius:12px;padding:14px 20px;font:600 16px "Noto Sans Tamil",sans-serif;cursor:pointer}
.gold{background:linear-gradient(135deg,#b8902a,var(--gold2));color:#1a1405}
.ghost{background:transparent;border:1px solid var(--line);color:var(--mute)}
.danger{background:transparent;border:1px solid #7a2e2e;color:#e08a8a}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:flex-end;z-index:5}
.sheet.show{display:flex}
.paper{width:100%;max-height:92%;overflow:auto;background:var(--card);border-top:2px solid var(--gold);border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0))}
.paper h2{margin:0 0 2px;text-align:center;font-family:"Noto Serif Tamil",serif;color:var(--gold)}
.meta{text-align:center;color:var(--mute);font-size:12px;margin-bottom:14px}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{padding:8px 4px;border-bottom:1px dashed var(--line);text-align:right}
td:first-child,th:first-child{text-align:left}
th{color:var(--mute);font-weight:400;font-size:12px}
.grand{display:flex;justify-content:space-between;margin:14px 0;font-size:22px;color:var(--gold2);font-weight:700}
.row{display:flex;gap:10px;margin-top:14px}.row .btn{flex:1}
label{display:block;margin:14px 0 6px;color:var(--mute);font-size:13px}
input[type=text],input[type=number],input[type=password]{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:#120d07;color:var(--text);font:17px "Noto Sans Tamil",sans-serif}
input:focus{outline:2px solid var(--gold);outline-offset:1px}
.snap{display:flex;align-items:center;gap:14px;margin-top:10px}
.snap .ph{width:84px;height:84px;font-size:30px}
.fl{position:relative;overflow:hidden;text-align:center;display:block;padding:12px 10px;font-size:15px}.fl input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.err{color:#e08a8a;font-size:13px;min-height:18px;margin-top:8px;text-align:center}
@media print{body>*:not(#sheet){display:none}#sheet{position:static;background:#fff;display:block}#sheet .paper{background:#fff;color:#000;border:0}.row{display:none}}
</style>
</head>
<body>
<header>
  <h1 id="shop">டீ கடை</h1>
  <p>ஐட்டத்தை தொடுங்கள் · + / − மூலம் எண்ணிக்கை மாற்றுங்கள்</p>
  <button class="cog" id="cog" aria-label="கடை பெயர் மாற்று">✎</button>
</header>
<button class="addbtn" id="addb">＋ புதிய ஐட்டம் சேர்</button>
<div class="list" id="list"></div>
<div class="hint">ஐட்டத்தை நீண்ட நேரம் அழுத்தினால் மாற்ற / நீக்க முடியும்</div>

<div class="bar">
  <div class="tot"><small id="cnt">0 ஐட்டம்</small><strong id="sum">₹0</strong></div>
  <button class="btn ghost" id="clr">அழி</button>
  <button class="btn gold" id="bill">பில் போடு</button>
</div>

<!-- Bill -->
<div class="sheet" id="sheet"><div class="paper">
  <h2 id="bshop"></h2><div class="meta" id="meta"></div>
  <table><thead><tr><th>ஐட்டம்</th><th>விலை</th><th>எண்</th><th>தொகை</th></tr></thead><tbody id="rows"></tbody></table>
  <div class="grand"><span>மொத்தம்</span><span id="gt"></span></div>
  <div class="row"><button class="btn ghost" id="bclose">மூடு</button><button class="btn gold" id="print">பிரிண்ட்</button></div>
</div></div>

<!-- Add / edit item -->
<div class="sheet" id="isheet"><div class="paper">
  <h2 id="ititle">புதிய ஐட்டம்</h2>
  <div class="snap">
    <div class="ph" id="iph">📷</div>
    <div style="display:grid;gap:8px;flex:1">
      <label class="btn gold fl">📷 கேமரா திற<input type="file" id="file" accept="image/*" capture="environment"></label>
      <label class="btn ghost fl">🖼 கேலரியில் தேர்வு<input type="file" id="file2" accept="image/*"></label>
    </div>
  </div>
  <label for="iname">ஐட்டம் பெயர்</label>
  <input type="text" id="iname" placeholder="உதா: மசாலா டீ" autocomplete="off">
  <label for="iprice">விலை (₹)</label>
  <input type="number" id="iprice" inputmode="decimal" min="0" placeholder="10">
  <div class="err" id="ierr"></div>
  <div class="row"><button class="btn ghost" id="iclose">ரத்து</button><button class="btn gold" id="isave">சேமி</button></div>
  <div class="row" id="delrow" style="display:none"><button class="btn danger" id="idel">இந்த ஐட்டத்தை நீக்கு</button></div>
</div></div>

<!-- Shop name (password) -->
<div class="sheet" id="ssheet"><div class="paper">
  <h2>கடை பெயர் மாற்று</h2>
  <div class="meta" id="smeta"></div>
  <div id="sstep1">
    <label for="spw" id="spwl">பாஸ்வேர்டு</label>
    <input type="password" id="spw" autocomplete="off">
  </div>
  <div id="sstep2" style="display:none">
    <label for="sname">புதிய கடை பெயர்</label>
    <input type="text" id="sname" autocomplete="off">
    <label for="snpw">புதிய பாஸ்வேர்டு (மாற்ற வேண்டுமானால் மட்டும்)</label>
    <input type="password" id="snpw" autocomplete="off">
  </div>
  <div class="err" id="serr"></div>
  <div class="row"><button class="btn ghost" id="sclose">மூடு</button><button class="btn gold" id="sok">சரி</button></div>
</div></div>

<script>
const $=id=>document.getElementById(id);
const store={
  get(k){try{return localStorage.getItem(k)}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}
};
const fmt=n=>"₹"+n.toLocaleString("en-IN");
const DEFAULTS=[["டீ",10],["காபி",12],["பால்",12],["பிளாக் டீ",8],["இஞ்சி டீ",12],["ஹார்லிக்ஸ்",20],["போர்ன்விட்டா",20],["பன்",10],["பிஸ்கட்",5],["வடை",8],["போண்டா",8],["சமோசா",10],["பஜ்ஜி",10],["சுக்கு காபி",15]];
let items;
try{items=JSON.parse(store.get("tea_items"))}catch(e){}
if(!Array.isArray(items))items=DEFAULTS.map((d,i)=>({id:"d"+i,n:d[0],p:d[1],img:""}));
let shop=store.get("tea_shop")||"டீ கடை";
const q={};
const saveItems=()=>{if(!store.set("tea_items",JSON.stringify(items)))alert("சேமிக்க இடம் இல்லை. போட்டோ இல்லாமல் முயற்சிக்கவும்.")};

function renderShop(){$("shop").textContent=shop;document.title=shop+" பில்லிங்"}
function render(){
  const list=$("list");list.innerHTML="";let t=0,c=0;
  items.forEach(it=>{
    const n=q[it.id]||0;t+=n*it.p;c+=n;
    const d=document.createElement("div");d.className="item"+(n?" on":"");
    const ph=it.img?`style="background-image:url(${it.img})"`:"";
    d.innerHTML=`<div class="ph" ${ph}>${it.img?"":esc(it.n.charAt(0))}</div>
    <div class="info"><div class="nm">${esc(it.n)}</div><div class="pr">₹${it.p}</div></div>
    <span class="add">தொடுங்கள்</span>
    <div class="qty"><button data-a="-">−</button><b>${n}</b><button data-a="+">+</button></div>`;
    let timer,long=false;
    const start=e=>{if(e.target.dataset&&e.target.dataset.a)return;long=false;timer=setTimeout(()=>{long=true;openItem(it)},650)};
    const stop=()=>clearTimeout(timer);
    d.addEventListener("touchstart",start,{passive:true});d.addEventListener("touchend",stop);d.addEventListener("touchmove",stop);d.addEventListener("touchcancel",stop);
    d.addEventListener("mousedown",start);d.addEventListener("mouseup",stop);d.addEventListener("mouseleave",stop);
    d.addEventListener("contextmenu",e=>e.preventDefault());
    d.addEventListener("click",e=>{
      if(long){long=false;return}
      const a=e.target.dataset&&e.target.dataset.a;
      if(a==="-")q[it.id]=Math.max(0,n-1);
      else if(a==="+")q[it.id]=n+1;
      else if(n===0)q[it.id]=1;
      render();
    });
    list.appendChild(d);
  });
  $("sum").textContent=fmt(t);$("cnt").textContent=c+" ஐட்டம்";
}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}

$("clr").onclick=()=>{if(Object.values(q).some(x=>x)&&confirm("எல்லாவற்றையும் அழிக்கவா?")){for(const k in q)delete q[k];render()}};
$("bill").onclick=()=>{
  let t=0,h="";
  items.forEach(it=>{const n=q[it.id]||0;if(n){const a=n*it.p;t+=a;h+=`<tr><td>${esc(it.n)}</td><td>${it.p}</td><td>${n}</td><td>${a}</td></tr>`}});
  if(!h){alert("முதலில் ஐட்டம் தேர்வு செய்யுங்கள்");return}
  $("rows").innerHTML=h;$("gt").textContent=fmt(t);$("bshop").textContent=shop;
  $("meta").textContent=new Date().toLocaleString("ta-IN",{dateStyle:"medium",timeStyle:"short"});
  $("sheet").classList.add("show");
};
$("bclose").onclick=()=>$("sheet").classList.remove("show");
$("print").onclick=()=>window.print();

/* ---- Add / edit item ---- */
let editing=null,photo="";
function openItem(it){
  editing=it||null;photo=it?it.img:"";
  $("ititle").textContent=it?"ஐட்டத்தை மாற்று":"புதிய ஐட்டம்";
  $("iname").value=it?it.n:"";$("iprice").value=it?it.p:"";$("ierr").textContent="";
  $("delrow").style.display=it?"flex":"none";
  showPh();$("isheet").classList.add("show");
}
function showPh(){
  const p=$("iph");
  if(photo){p.style.backgroundImage=`url(${photo})`;p.textContent=""}
  else{p.style.backgroundImage="";p.textContent="📷"}
}
$("addb").onclick=()=>openItem(null);
const onPhoto=e=>{
  const f=e.target.files[0];if(!f)return;
  const img=new Image(),url=URL.createObjectURL(f);
  img.onload=()=>{
    const s=200,c=document.createElement("canvas");c.width=c.height=s;
    const m=Math.min(img.width,img.height),sx=(img.width-m)/2,sy=(img.height-m)/2;
    c.getContext("2d").drawImage(img,sx,sy,m,m,0,0,s,s);
    photo=c.toDataURL("image/jpeg",0.72);URL.revokeObjectURL(url);showPh();
  };
  img.src=url;e.target.value="";
};
$("file").onchange=onPhoto;$("file2").onchange=onPhoto;
$("iclose").onclick=()=>$("isheet").classList.remove("show");
$("isave").onclick=()=>{
  const n=$("iname").value.trim(),p=parseFloat($("iprice").value);
  if(!n){$("ierr").textContent="ஐட்டம் பெயர் போடுங்கள்";return}
  if(isNaN(p)||p<0){$("ierr").textContent="சரியான விலை போடுங்கள்";return}
  if(editing){editing.n=n;editing.p=p;editing.img=photo}
  else items.push({id:"i"+Date.now(),n,p,img:photo});
  saveItems();render();$("isheet").classList.remove("show");
};
$("idel").onclick=()=>{
  if(editing&&confirm(editing.n+" ஐ நீக்கவா?")){items=items.filter(x=>x!==editing);delete q[editing.id];saveItems();render();$("isheet").classList.remove("show")}
};

/* ---- Shop name with password ---- */
async function hash(s){
  try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("tea:"+s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
  catch(e){return "p:"+btoa(unescape(encodeURIComponent(s)))}
}
let unlocked=false;
function openShop(){
  unlocked=false;const has=!!store.get("tea_pw");
  $("sstep1").style.display="";$("sstep2").style.display="none";
  $("spw").value="";$("serr").textContent="";
  $("spwl").textContent=has?"பாஸ்வேர்டு":"புதிய பாஸ்வேர்டு உருவாக்குங்கள் (நினைவில் வையுங்கள்)";
  $("smeta").textContent=has?"பாஸ்வேர்டு போட்டால் மட்டுமே பெயர் மாறும்":"முதல் முறை: ஒரு பாஸ்வேர்டு அமைக்கவும்";
  $("ssheet").classList.add("show");
}
$("cog").onclick=openShop;
$("sclose").onclick=()=>$("ssheet").classList.remove("show");
$("sok").onclick=async()=>{
  const err=$("serr");err.textContent="";
  if(!unlocked){
    const pw=$("spw").value;
    if(pw.length<4){err.textContent="குறைந்தது 4 எழுத்து வேண்டும்";return}
    const h=await hash(pw),saved=store.get("tea_pw");
    if(!saved){store.set("tea_pw",h)}
    else if(saved!==h){err.textContent="பாஸ்வேர்டு தவறு";return}
    unlocked=true;$("sstep1").style.display="none";$("sstep2").style.display="";
    $("sname").value=shop;$("snpw").value="";$("smeta").textContent="பெயரை மாற்றி சரி அழுத்தவும்";
    return;
  }
  const n=$("sname").value.trim();
  if(!n){err.textContent="கடை பெயர் போடுங்கள்";return}
  shop=n;store.set("tea_shop",n);
  const np=$("snpw").value;
  if(np){if(np.length<4){err.textContent="புதிய பாஸ்வேர்டு குறைந்தது 4 எழுத்து";return}store.set("tea_pw",await hash(np))}
  renderShop();$("ssheet").classList.remove("show");
};

renderShop();render();
</script>
</body>
</html>
